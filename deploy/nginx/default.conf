# KubeSetu — NGINX server config (included in the http{} context of nginx-unprivileged).

# Cache policy by response type: HTML always revalidates, static assets are cached.
map $sent_http_content_type $kubesetu_expires {
    default                 off;
    ~*text/html             epoch;
    ~*text/css              7d;
    ~*javascript            7d;
    ~*image/                30d;
    ~*font/                 30d;
    ~*application/xml       1h;
    ~*text/plain            1h;
}

server {
    # IPv4 only: an IPv6 listen fails to start on clusters/pods with IPv6 disabled.
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens       off;
    absolute_redirect   off;   # avoid leaking :8080 in redirects behind the ingress
    port_in_redirect    off;
    charset             utf-8;

    # ---- Compression ----
    gzip               on;
    gzip_comp_level    5;
    gzip_min_length    256;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_types         text/plain text/css text/xml application/xml application/javascript
                       application/json application/rss+xml image/svg+xml font/ttf font/otf;

    # ---- Caching ----
    expires $kubesetu_expires;

    # ---- Security headers (server level; no add_header in locations, so they are inherited) ----
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Inline scripts/styles are used by the pages; Google Fonts is the only third party.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'" always;
    # HSTS is best set at the TLS terminator (ingress-nginx sets it by default).

    # ---- Health endpoint for kubelet probes ----
    location = /healthz {
        access_log    off;
        default_type  text/plain;
        return 200    "ok\n";
    }

    # ---- Never serve dotfiles or authoring templates ----
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location = /_template.html { return 404; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
