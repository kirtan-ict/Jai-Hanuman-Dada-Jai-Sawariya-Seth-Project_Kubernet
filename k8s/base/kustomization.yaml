apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jai-hanuman-dada

labels:
  - pairs:
      app.kubernetes.io/part-of: kubesetu
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

images:
  - name: ghcr.io/kirtan-ict/kubesetu-site
    newTag: latest
